# config/services.yaml
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ─── Gateways de Pagamento ────────────────────────────────────────────────────
    App\Billing\AsaasGateway:
        arguments:
            $apiKey:       '%env(ASAAS_API_KEY)%'
            $baseUrl:      '%env(ASAAS_BASE_URL)%'
            $webhookToken: '%env(ASAAS_WEBHOOK_TOKEN)%'
        tags:
            - { name: app.payment_gateway, alias: asaas }

    App\Billing\MercadoPagoGateway:
        arguments:
            $accessToken:  '%env(MP_ACCESS_TOKEN)%'
            $baseUrl:      '%env(MP_BASE_URL)%'
            $webhookSecret:'%env(MP_WEBHOOK_SECRET)%'
        tags:
            - { name: app.payment_gateway, alias: mercadopago }

    App\Billing\PagBankGateway:
        arguments:
            $token:        '%env(PAGBANK_TOKEN)%'
            $baseUrl:      '%env(PAGBANK_BASE_URL)%'
            $webhookToken: '%env(PAGBANK_WEBHOOK_TOKEN)%'
        tags:
            - { name: app.payment_gateway, alias: pagbank }

    App\Billing\PaymentGatewayInterface:
        alias: App\Billing\AsaasGateway

    App\Billing\GatewayRegistry:
        arguments:
            - !tagged_iterator { tag: app.payment_gateway, index_by: alias }

    # ─── Providers SMM externos ──────────────────────────────────────────────────────
    app.smm_provider.smmkings:
        class: App\Smm\GenericSmmProvider
        arguments:
            $slug:    'smmkings'
            $baseUrl: '%env(SMMKINGS_URL)%'
            $apiKey:  '%env(SMMKINGS_API_KEY)%'
        tags:
            - { name: app.smm_provider, alias: smmkings }

    app.smm_provider.justanother:
        class: App\Smm\GenericSmmProvider
        arguments:
            $slug:    'justanother'
            $baseUrl: '%env(JUSTANOTHER_URL)%'
            $apiKey:  '%env(JUSTANOTHER_API_KEY)%'
        tags:
            - { name: app.smm_provider, alias: justanother }

    app.smm_provider.peakerr:
        class: App\Smm\GenericSmmProvider
        arguments:
            $slug:    'peakerr'
            $baseUrl: '%env(PEAKERR_URL)%'
            $apiKey:  '%env(PEAKERR_API_KEY)%'
        tags:
            - { name: app.smm_provider, alias: peakerr }

    # ─── Registry de Providers SMM ───────────────────────────────────────────────────
    App\Smm\SmmProviderRegistry:
        arguments:
            - !tagged_iterator { tag: app.smm_provider, index_by: alias }
