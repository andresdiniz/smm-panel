# config/services.yaml
parameters:
    admin_email: '%env(ADMIN_EMAIL)%'
    affiliate.default_rate: '%env(float:AFFILIATE_DEFAULT_RATE)%'
    asaas.environment_default: 'production'
    seo.empty: ''
    seo.site_url: 'https://acheireviews.com.br'
    seo.gtm_id: '%env(default:seo.empty:GOOGLE_TAG_MANAGER_ID)%'
    seo.google_verification: '%env(default:seo.empty:GOOGLE_SITE_VERIFICATION)%'
    seo.bing_verification: '%env(default:seo.empty:BING_SITE_VERIFICATION)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Controller/Admin/*CrudController.php'
            - '../src/Billing/AsaasGateway.php'
            - '../src/Billing/Service/AsaasPaymentService.php'

    # ─── Gateways de Pagamento (instânciados dinamicamente do banco) ───
    App\Billing\GatewayRegistry:
        factory: ['@App\Billing\DynamicGatewayLoader', 'buildRegistry']

    App\Billing\DynamicGatewayLoader:
        arguments:
            $asaasEnvironment: '%env(default:asaas.environment_default:ASAAS_ENV)%'

    # ─── Registry SMM (instânciado dinamicamente do banco) ───
    App\Smm\SmmProviderRegistry:
        factory: ['@App\Smm\DynamicSmmProviderLoader', 'buildRegistry']

    # ─── DailyReportSchedule: injeta adminEmail ───
    App\Scheduler\DailyReportSchedule:
        arguments:
            $adminEmail: '%admin_email%'

    # ─── AffiliateService: taxa padrão de comissão (ex.: 0.05 = 5%) ───
    App\Service\AffiliateService:
        arguments:
            $defaultRate: '%affiliate.default_rate%'
