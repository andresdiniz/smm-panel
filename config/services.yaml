# config/services.yaml
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Bind da interface do gateway — trocar por AsaasGateway ou PagBankGateway em produção
    App\Billing\PaymentGatewayInterface:
        alias: App\Billing\StubPaymentGateway
