parameters:
    app.asaas_webhook_token: '%env(ASAAS_WEBHOOK_TOKEN)%'
    app.smm_provider_key: '%env(SMM_PROVIDER_KEY)%'
    app.smm_api_token: '%env(SMM_API_TOKEN)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'
