framework:
    messenger:
        failure_transport: failed

        transports:
            # Schedule "smm" — SmmSchedule (#[AsSchedule('smm')])
            scheduler_smm:
                dsn: 'schedule://smm'

            # Schedule "default" — DailyReportSchedule, ReconcilePaymentsSchedule, SyncOrdersSchedule
            scheduler_default:
                dsn: 'schedule://default'

            # Transporte de alta prioridade: envio ao provider (fallback/retry via ProcessOrderMessage)
            # e webhooks de pagamento.
            orders_high:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: orders_high
                retry_strategy:
                    max_retries: 5
                    delay: 2000
                    multiplier: 2
                    max_delay: 60000

            # Transporte de média prioridade: polling de status dos pedidos no provider.
            orders_medium:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: orders_medium
                retry_strategy:
                    max_retries: 10
                    delay: 5000
                    multiplier: 2
                    max_delay: 300000

            # Transporte de baixa prioridade: notificações, relatórios, CRM, limpeza.
            orders_low:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: orders_low
                retry_strategy:
                    max_retries: 3
                    delay: 10000
                    multiplier: 2

            failed:
                dsn: 'doctrine://default?queue_name=failed'

        buses:
            messenger.bus.default:
                middleware:
                    - dispatch_after_current_bus
                    - doctrine_transaction
                    - App\Messenger\Middleware\AuditMiddleware

        routing:
            # Fallback/retry: pedidos que ficaram PENDING (crash mid-request).
            # O fluxo normal envia ao provider de forma síncrona no OrderController.
            App\Message\ProcessOrderMessage:                   orders_high

            # Polling de status: consulta ao provider após envio.
            App\Message\Order\SyncOrderStatusMessage:          orders_medium

            # Notificações de pedido (completed, cancelled).
            App\Message\Order\OrderNotificationMessage:        orders_low

            # Billing
            App\Message\Billing\ProcessPaymentWebhookMessage:  orders_high
            App\Message\Billing\ReconcilePaymentMessage:       orders_low

            # CRM e tarefas agendadas
            App\Message\Crm\CrmSyncMessage:                    orders_low
            App\Message\Scheduler\SyncProviderBalanceMessage:  orders_low
            App\Message\Scheduler\DailyFinanceReportMessage:   orders_low
            App\Message\Scheduler\RemarketingEmailsMessage:    orders_low
            App\Message\Scheduler\CleanupExpiredTokensMessage: orders_low

            # E-mails transacionais — fila assíncrona com retry automático (3x)
            App\Message\SendWelcomeEmailMessage:               orders_low
            App\Message\SendDepositConfirmedEmailMessage:      orders_low
            App\Message\SendOrderCompletedEmailMessage:        orders_low
