# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Forca o Symfony a usar o var/cache do clone ativo da Hostinger.
    # A Hostinger faz deploy em .git_clones/git_clone_XXXXX/ mas o cache
    # padrao aponta para public_html/var/cache (deploy anterior), causando
    # conflito de templates compilados com paths errados.
    cache:
        app: cache.adapter.filesystem
        system: cache.adapter.system

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    rate_limiter:
        password_reset_request_ip:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
            cache_pool: cache.app
        password_reset_request_email:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
            cache_pool: cache.app
        password_reset_submit_ip:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
            cache_pool: cache.app
        wallet_pix_qr_refresh:
            policy: fixed_window
            limit: 6
            interval: '1 minute'
            cache_pool: cache.app

    #esi: true
    #fragments: true

when@prod:
    framework:
        disallow_search_engine_index: false

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
