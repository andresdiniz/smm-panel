framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
    csrf_protection: true
    http_client:
        scoped_clients:
            asaas.client:
                base_uri: '%env(ASAAS_API_URL)%'
                timeout: 15
            smm.client:
                base_uri: '%env(SMM_PROVIDER_URL)%'
                timeout: 20
    rate_limiter:
        api:
            policy: 'sliding_window'
            limit: 120
            interval: '1 minute'
