services:
  app:
    build: .
    environment:
      DATABASE_URL: mysql://smm:secret@db:3306/smm_panel?serverVersion=8.0.36&charset=utf8mb4
    depends_on:
      - db
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smm_panel
      MYSQL_USER: smm
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root-secret
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
