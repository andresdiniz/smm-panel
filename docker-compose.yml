services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-smm_panel}
      MYSQL_USER: ${DATABASE_USER:-smm}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    image: php:8.4-fpm-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: mysql://${DATABASE_USER:-smm}:${DATABASE_PASSWORD:-secret}@database:3306/${DATABASE_NAME:-smm_panel}?serverVersion=8.4&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: doctrine://default

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  messenger:
    image: php:8.4-fpm-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    command: php bin/console messenger:consume async -vv --time-limit=3600
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: mysql://${DATABASE_USER:-smm}:${DATABASE_PASSWORD:-secret}@database:3306/${DATABASE_NAME:-smm_panel}?serverVersion=8.4&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: doctrine://default

volumes:
  database_data:
