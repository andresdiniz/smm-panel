[program:smm_worker_high]
command=php /var/www/smm-panel/bin/console messenger:consume orders_high --time-limit=3600 --memory-limit=128M
numprocs=3
autostart=true
autorestart=true
stdout_logfile=/var/log/smm/worker_high.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/smm/worker_high_error.log

[program:smm_worker_medium]
command=php /var/www/smm-panel/bin/console messenger:consume orders_medium --time-limit=3600 --memory-limit=128M
numprocs=2
autostart=true
autorestart=true
stdout_logfile=/var/log/smm/worker_medium.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/smm/worker_medium_error.log

[program:smm_worker_low]
command=php /var/www/smm-panel/bin/console messenger:consume orders_low --time-limit=3600 --memory-limit=128M
numprocs=1
autostart=true
autorestart=true
stdout_logfile=/var/log/smm/worker_low.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/smm/worker_low_error.log

[program:smm_scheduler]
command=php /var/www/smm-panel/bin/console messenger:consume scheduler_smm --time-limit=3600 --memory-limit=64M
numprocs=1
autostart=true
autorestart=true
stdout_logfile=/var/log/smm/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/smm/scheduler_error.log

[group:smm]
programs=smm_worker_high,smm_worker_medium,smm_worker_low,smm_scheduler
